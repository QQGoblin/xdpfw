apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xfw
spec:
  selector:
    matchLabels:
      app: xfw
  template:
    metadata:
      labels:
        app: xfw
    spec:
      hostNetwork: true
      containers:
        - name: runtime
          image: registry.lqingcloud.cn/library/xfw:ubuntu24.04
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/tini", "--", "/usr/bin/bash"]
          workingDir: /etc/tempesta
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /etc/tempesta
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: kernel-btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: boot
              mountPath: /boot
              readOnly: true
      volumes:
        - name: config
          hostPath:
            path: /etc/tempesta
            type: DirectoryOrCreate
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: kernel-btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: boot
          hostPath:
            path: /boot
            type: Directory